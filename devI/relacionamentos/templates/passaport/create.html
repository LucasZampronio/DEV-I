{% extends "base.html" %}

{% block title %}

    <h1>Cadastrar passaporte</h1>
{% endblock title %}
    {% block content %}
        <form id="passaporte" method="post" action="{% url 'relacionamentos:classe_generica_passaporte_create' %}">
            {% csrf_token %}
            {{form.as_p}}
            <button type="submit" class="btn btn-outline-success btn-lg"> Cadastrar</button>
            <button type="reset" class="btn btn-outline-danger btn-lg"> Resetar</button>
            <a  role='button' title='Voltar'class=" btn-outline-secondary bi bi-arrow-left" href="{% url 'relacionamentos:classe_generica_passaporte_list' %}">
            Voltar
            </a>
        </form>
        
    {% endblock content %}
